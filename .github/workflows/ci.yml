name: FreeRTOS Firmware Quality & Compliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  esp-idf-structure:
    name: ESP-IDF Architecture & CMake Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate ESP-IDF Project Layout
        run: |
          echo "Checking ESP-IDF project files..."
          test -f CMakeLists.txt
          test -f main/CMakeLists.txt
          test -d components
          test -d docs
          echo "ESP-IDF v5 project layout is compliant!"

  firmware-static-audit:
    name: Code Hygiene & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Firmware Headers & Docs
        run: |
          echo "Verifying technical documentation..."
          test -f docs/ROADMAP_KY_THUAT.md
          echo "FreeRTOS technical roadmap verified!"
